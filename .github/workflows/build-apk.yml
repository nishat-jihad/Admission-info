# ============================================================================
# Admission Info — Android APK বানানো (GitHub নিজেই ক্লাউডে বানায়)
#
# কীভাবে চালাবে: GitHub-এ রিপোর "Actions" ট্যাব → "Build Android APK" → "Run workflow" বাটন।
# ১০–১৫ মিনিট পর "Releases" অংশে admission-info.apk তৈরি থাকবে।
# সরাসরি ডাউনলোড লিংক:
#   https://github.com/<মালিক>/<রিপো>/releases/latest/download/admission-info.apk
#
# সাইনিং (আসল কী): রিপোর Settings → Secrets and variables → Actions-এ ৪টা secret দিলে
# প্রতিবার একই কী দিয়ে সাইন হবে (তখন পুরোনো অ্যাপের ওপর আপডেট ইন্সটল হয়):
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
# secret না দিলে debug কী দিয়ে বানায় — ইন্সটল হয়, কিন্তু পরের ভার্সন ইন্সটলের আগে পুরোনোটা মুছতে হয়।
# ============================================================================
name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: "অ্যাপের ভার্সন (যেমন 1.0.1)। ফাঁকা রাখলে package.json-এর ভার্সন।"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chance-hobe-ki
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: ভার্সন ঠিক করা
        id: ver
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          V="$INPUT_VERSION"
          if [ -z "$V" ]; then V=$(node -p "require('./package.json').version"); fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "ভার্সন: $V"

      - name: প্যাকেজ ইন্সটল
        run: npm install --no-audit --no-fund

      - name: সাইট বিল্ড (অ্যাপ মোড, static)
        env:
          NEXT_PUBLIC_APP: "1"
          NEXT_PUBLIC_APP_VERSION: ${{ steps.ver.outputs.version }}
          NEXT_PUBLIC_GITHUB_REPO: ${{ github.repository }}
        run: |
          npx next build
          # PDF গুলো অ্যাপে বান্ডেল হয় না (ব্রাউজারে ওয়েবসাইট থেকে খোলে) — APK ছোট থাকে
          rm -rf out/docs

      - name: Android প্রজেক্ট তৈরি
        run: |
          npx cap add android
          npx --yes @capacitor/assets generate --android
          npx cap sync android

      - name: ভার্সন নম্বর বসানো
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          sed -i "s/versionCode 1/versionCode $RUN_NUMBER/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"$VERSION\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle

      - name: APK বানানো
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            ./gradlew assembleRelease \
              -Pandroid.injected.signing.store.file="$RUNNER_TEMP/release.keystore" \
              -Pandroid.injected.signing.store.password="$KS_PASS" \
              -Pandroid.injected.signing.key.alias="$KS_ALIAS" \
              -Pandroid.injected.signing.key.password="$KEY_PASS"
            cp app/build/outputs/apk/release/app-release.apk ../admission-info.apk
          else
            echo "::warning::Keystore secret নেই — debug কী দিয়ে বানানো হচ্ছে।"
            ./gradlew assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk ../admission-info.apk
          fi

      - name: APK সংরক্ষণ (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: admission-info-apk
          path: chance-hobe-ki/admission-info.apk

      - name: Release-এ আপলোড
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Admission Info v${{ steps.ver.outputs.version }}
          body: "Admission Info Android অ্যাপ v${{ steps.ver.outputs.version }}। admission-info.apk ডাউনলোড করে ইন্সটল করো।"
          files: chance-hobe-ki/admission-info.apk
          make_latest: true

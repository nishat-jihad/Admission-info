# ============================================================================
# Admission Info — Android APK + অ্যাপ-আপডেট ফাইল বানানো (GitHub নিজেই ক্লাউডে বানায়)
#
# কখন চলে:
#   ১) main branch-এ chance-hobe-ki/ ফোল্ডারে কিছু বদলে commit করলেই নিজে থেকে চলে
#      (ওয়েবসাইটের কোনো লেখা/UI/নিউজ বদলালে অ্যাপের জন্য নতুন ভার্সন তৈরি হয়)
#   ২) হাতে: Actions ট্যাব → Build Android APK → Run workflow
#
# কী তৈরি হয় (Releases-এ):
#   admission-info.apk — নতুন ইন্সটলের জন্য
#   bundle.zip         — অ্যাপের ভেতরে "আপডেট করো" চাপলে এটাই নামে (APK ইন্সটল লাগে না)
#
# ভার্সন: package.json-এর প্রথম দুই অংশ + run নম্বর (যেমন 1.0.7)। নিজে দিতে চাইলে Run workflow-এ লিখো।
# পপ-আপে "কী বদলেছে" হিসেবে commit message (বা হাতে চালালে notes ঘর) দেখায়।
#
# সাইনিং secret (APK-র জন্য, ঐচ্ছিক): ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
#   ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
# পুশ নোটিফিকেশন secret (ঐচ্ছিক): GOOGLE_SERVICES_JSON (Firebase-এর google-services.json ফাইলের পুরো লেখা)
#   + FIREBASE_SERVICE_ACCOUNT_JSON (Firebase-এর service account key ফাইলের পুরো লেখা — নোটিফিকেশন নিজে পাঠানোর জন্য)
# নোটিফিকেশন যায় শুধু commit message "[notify]" দিয়ে শুরু হলে (বা হাতে চালালে notify টিক দিলে)।
# ============================================================================
name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - "chance-hobe-ki/**"
  workflow_dispatch:
    inputs:
      version:
        description: "অ্যাপের ভার্সন (যেমন 1.0.1)। ফাঁকা রাখলে নিজে বানাবে।"
        required: false
        default: ""
      notes:
        description: "নতুন কী কী বদলেছে (ইউজার আপডেট পপ-আপে দেখবে)। ফাঁকা রাখলেও চলে।"
        required: false
        default: ""
      notify:
        description: "ইউজারদের নোটিফিকেশন পাঠাবে? (টিক দিলে উপরের notes-ই নোটিফিকেশনের লেখা)"
        type: boolean
        required: false
        default: false

concurrency:
  group: build-apk
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chance-hobe-ki
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: ভার্সন ঠিক করা
        id: ver
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          V="$INPUT_VERSION"
          if [ -z "$V" ]; then
            BASE=$(node -p "require('./package.json').version.split('.').slice(0,2).join('.')")
            V="$BASE.$RUN_NUMBER"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "ভার্সন: $V"

      - name: পুশ নোটিফিকেশন (Firebase) আছে কি না
        id: push
        env:
          GSJ: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GSJ" ]; then echo "enabled=1" >> "$GITHUB_OUTPUT"; else echo "enabled=0" >> "$GITHUB_OUTPUT"; fi

      - name: প্যাকেজ ইন্সটল
        run: npm install --no-audit --no-fund

      - name: সাইট বিল্ড (অ্যাপ মোড, static)
        env:
          NEXT_PUBLIC_APP: "1"
          NEXT_PUBLIC_APP_VERSION: ${{ steps.ver.outputs.version }}
          NEXT_PUBLIC_GITHUB_REPO: ${{ github.repository }}
          NEXT_PUBLIC_PUSH: ${{ steps.push.outputs.enabled }}
        run: |
          # Google Fonts (next/font) নামানো মাঝে মাঝে ক্ষণিকের জন্য ব্যর্থ হয় — তাই সর্বোচ্চ ৩ বার চেষ্টা করে
          for i in 1 2 3; do
            if npx next build; then break; fi
            if [ "$i" = "3" ]; then
              echo "::error::৩ বার চেষ্টা করেও সাইট বিল্ড হলো না"
              exit 1
            fi
            echo "::warning::বিল্ড ব্যর্থ (চেষ্টা $i/3) — ২০ সেকেন্ড পর আবার চেষ্টা"
            rm -rf .next out
            sleep 20
          done
          # PDF গুলো অ্যাপে বান্ডেল হয় না (ব্রাউজারে ওয়েবসাইট থেকে খোলে) — APK ছোট থাকে
          rm -rf out/docs
          # অ্যাপের ভেতরে "আপডেট করো" চাপলে এই zip নামে (index.html জিপের একদম উপরে)
          (cd out && zip -qrX ../bundle.zip .)
          # যাচাই: index.html জিপের একদম উপরে না থাকলে অ্যাপ এই bundle চালাতে পারবে না — তাই এখানেই বিল্ড থামিয়ে দেয়
          ls -lh bundle.zip
          unzip -l bundle.zip | head -15
          if ! unzip -Z1 bundle.zip | grep -qx "index.html"; then
            echo "::error::bundle.zip-এর উপরের স্তরে index.html নেই"
            exit 1
          fi

      - name: Android প্রজেক্ট তৈরি
        env:
          GSJ: ${{ secrets.GOOGLE_SERVICES_JSON }}
          PUSH_ENABLED: ${{ steps.push.outputs.enabled }}
        run: |
          npx cap add android
          npx --yes @capacitor/assets generate --android
          npx cap sync android
          # Android 13+ নোটিফিকেশন পারমিশন
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#&\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />#' android/app/src/main/AndroidManifest.xml
          # নতুন প্লাগইনের লাইব্রেরি Android SDK 35 চায় — তাই compileSdk 35 করা (targetSdk/minSdk বদলায় না)
          sed -i 's/compileSdkVersion = 34/compileSdkVersion = 35/' android/variables.gradle
          # নতুন লাইব্রেরি Android 6 (API 23) বা তার ওপরের ফোন চায়
          sed -i 's/minSdkVersion = 22/minSdkVersion = 23/' android/variables.gradle
          echo "android.suppressUnsupportedCompileSdk=35" >> android/gradle.properties
          grep -n "compileSdkVersion\|targetSdkVersion\|minSdkVersion" android/variables.gradle
          if [ "$PUSH_ENABLED" = "1" ]; then
            printf '%s' "$GSJ" > android/app/google-services.json
          fi

      - name: ভার্সন নম্বর বসানো
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          sed -i "s/versionCode 1/versionCode $RUN_NUMBER/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"$VERSION\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle

      - name: APK বানানো
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            ./gradlew assembleRelease \
              -Pandroid.injected.signing.store.file="$RUNNER_TEMP/release.keystore" \
              -Pandroid.injected.signing.store.password="$KS_PASS" \
              -Pandroid.injected.signing.key.alias="$KS_ALIAS" \
              -Pandroid.injected.signing.key.password="$KEY_PASS"
            cp app/build/outputs/apk/release/app-release.apk ../admission-info.apk
          else
            echo "::warning::Keystore secret নেই — debug কী দিয়ে বানানো হচ্ছে।"
            ./gradlew assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk ../admission-info.apk
          fi

      - name: ফাইল সংরক্ষণ (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: admission-info-apk
          path: |
            chance-hobe-ki/admission-info.apk
            chance-hobe-ki/bundle.zip

      - name: Release-এ আপলোড
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Admission Info v${{ steps.ver.outputs.version }}
          body: ${{ toJSON(github.event.inputs.notes || github.event.head_commit.message || 'অ্যাপের নতুন ভার্সন।') }}
          files: |
            chance-hobe-ki/admission-info.apk
            chance-hobe-ki/bundle.zip
          make_latest: true

      # Release তৈরি হওয়ার পরে (যাতে নোটিফিকেশনে চাপলেই নতুন ভার্সন পাওয়া যায়)।
      # commit message [notify] দিয়ে শুরু হলে (বা হাতে চালালে notify টিক থাকলে) সব ইউজারের ফোনে যায়।
      - name: ইউজারদের নোটিফিকেশন পাঠানো
        working-directory: .
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          EVENT_NAME: ${{ github.event_name }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          INPUT_NOTIFY: ${{ github.event.inputs.notify }}
          INPUT_NOTES: ${{ github.event.inputs.notes }}
        run: node scripts/send-notification.mjs
